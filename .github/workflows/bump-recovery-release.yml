name: bump-recovery-release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bump-recovery-release.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update installer workflow to v0.1.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-installer.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ZKas Wallet Bridge Alert v0.1.0', 'ZKas Wallet Bridge Alert v0.1.1')
          s = s.replace('ZKas Wallet Bridge Alert Installer v0.1.0', 'ZKas Wallet Bridge Alert Installer v0.1.1')
          s = s.replace('Publish v0.1.0 release', 'Publish v0.1.1 release')
          s = s.replace("RELEASE_V0.1.0", "RELEASE_V0.1.1")
          s = s.replace("'v0.1.0'", "'v0.1.1'")
          p.write_text(s, encoding='utf-8')
          PY
          printf 'Publish ZKas Wallet Bridge Alert Installer v0.1.1\n' > RELEASE_V0.1.1
          rm -f RELEASE_V0.1.0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-installer.yml RELEASE_V0.1.1
          git rm -f RELEASE_V0.1.0 || true
          git commit -m "Publish recovery-state installer v0.1.1"
          git push
